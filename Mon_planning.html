<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Planning — Temps & Progression</title>
<style>
:root{--ink:#172b45;--muted:#73839a;--blue:#3478d4;--cyan:#23a7b7;--bg:#f3f6fb;--line:#e4eaf2;--green:#15966a;--orange:#d58a27}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}
.app{display:flex;min-height:100vh}.sidebar{width:235px;background:#142941;color:white;padding:22px 15px;flex-shrink:0}.logo{font-size:19px;font-weight:850;padding:6px 10px 28px}.logo span{color:#54d1d4}.nav button{display:block;width:100%;border:0;background:transparent;color:#c6d4e4;text-align:left;padding:12px;border-radius:9px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.nav small{display:block;color:#8ea4bb;letter-spacing:1.2px;padding:18px 11px 6px;font-size:10px}.main{flex:1;min-width:0}.top{height:65px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.content{max-width:1450px;margin:auto;padding:25px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.heading h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 13px;border-radius:9px;cursor:pointer;font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:white}.greenbtn{background:var(--green);color:white;border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 5px 18px #17314d08}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin:7px 0}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.panel h3{margin:0 0 14px;font-size:15px}.timer{background:linear-gradient(135deg,#173451,#245e82);color:white;border-radius:15px;padding:22px}.timer .time{font-size:42px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:8px 0}.timer select{width:100%;padding:10px;border-radius:8px;border:0;margin:8px 0 13px}.timer .muted{color:#c6d9e8}.timer .btn{margin-right:5px}.progress{height:9px;background:#eaf0f6;border-radius:20px;overflow:hidden;margin:8px 0 15px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2c8bd8,#29b7b0);border-radius:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.goal{padding:10px 0;border-bottom:1px solid #edf1f5}.goal:last-child{border:0}.pill{font-size:10px;border-radius:20px;padding:4px 8px;background:#eaf2ff;color:#2868ae;font-weight:700}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:white}.schedule{border-collapse:collapse;width:100%;min-width:900px}.schedule th{background:#f8fafc;color:#708096;text-align:left;font-size:11px;padding:12px}.schedule td{border-top:1px solid #edf1f5;padding:9px;vertical-align:top}.slot{background:#edf5ff;border-left:3px solid #4387d5;border-radius:7px;padding:8px;min-width:95px;font-size:11px;cursor:pointer}.slot.sport{background:#eaf8f3;border-color:#1aa477}.slot.rest{background:#f3f4f7;border-color:#aab5c3}.slot b{display:block;margin-bottom:3px}.slot small{color:#62758c}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field,input,textarea,select{border:1px solid #dce4ed;border-radius:8px;padding:10px;font:inherit;color:var(--ink);background:white}.field{min-width:150px}.days{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.days button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;cursor:pointer}.days button.active{background:var(--blue);color:white;border-color:var(--blue)}.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:8px}.daycol{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:180px}.daycol h4{margin:3px 0 10px;font-size:12px}.task{background:white;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;font-size:11px;cursor:pointer}.task strong{display:block;margin-bottom:4px}.task.active{border-color:var(--blue);box-shadow:0 0 0 2px #3478d420}.checkrow{display:grid;grid-template-columns:95px 1fr 1fr 1.3fr;gap:10px;padding:11px;border-bottom:1px solid #edf1f5;align-items:center;font-size:12px}.checkrow.head{font-weight:700;color:var(--muted);background:#f8fafc}.checkrow input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}.note{width:100%;min-width:120px;padding:7px}.monthnav{display:flex;gap:8px;align-items:center}.empty{text-align:center;color:var(--muted);padding:25px}.modalbg{display:none;position:fixed;inset:0;background:#10243b88;z-index:9;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;border-radius:14px;padding:21px;width:min(560px,100%);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.group{display:flex;flex-direction:column;gap:5px}.group label{font-size:11px;font-weight:700;color:#65768a}.group input,.group select{width:100%}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hamb{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.weekgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.sidebar{position:fixed;z-index:8;left:-245px;top:0;bottom:0;transition:.2s}.sidebar.open{left:0}.hamb{display:inline-block}.content{padding:16px 11px}.top{padding:0 12px}.heading{align-items:flex-start;flex-direction:column}.cards{gap:8px}.card,.panel{padding:13px}.weekgrid{grid-template-columns:repeat(2,1fr)}.timer .time{font-size:34px}.form{grid-template-columns:1fr}.full{grid-column:auto}.checkrow{grid-template-columns:70px 1fr 1fr;}.checkrow .notescol{grid-column:1/-1}}
@media print{.sidebar,.top,.heading .btn,.toolbar,.timer button,.modalbg{display:none!important}.content{max-width:none;padding:0}.panel,.card{box-shadow:none;break-inside:avoid}body{background:white}}\n</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="logo">⏱ TEMPS<span> & MOI</span><div style="font-size:9px;color:#9bb0c5;letter-spacing:2px;margin-top:5px">PLANNING PERSONNEL</div></div><nav class="nav">
<small>MON ESPACE</small><button class="active" data-page="home">▦ Tableau de bord</button><button data-page="week">📅 Emploi du temps</button><button data-page="timerpage">⏱ Chronomètre</button><button data-page="month">🗓 Suivi mensuel</button><button data-page="history">📈 Historique</button><button data-page="stats">📊 Statistiques & bilans</button><small>PERSONNALISATION</small><button data-page="settings">⚙ Objectifs & réglages</button></nav><div class="muted" style="color:#9bb0c5;margin:35px 10px">Version locale · 1.0</div></aside>
<section class="main"><header class="top"><div><button class="btn hamb" id="hamb">☰</button>　<b id="crumb">Tableau de bord</b></div><span class="muted" id="today"></span></header>
<main class="content"><div class="heading"><div><h1 id="title">Bonjour, prêt à progresser ?</h1><div class="muted" id="subtitle">Organise tes journées, lance le chronomètre et observe tes progrès.</div></div><div><button class="btn" id="export">⇩ Exporter les données</button> <button class="btn primary" id="quick">＋ Ajouter une activité</button></div></div><div id="view"></div></main></section></div>
<div class="modalbg" id="modal"><div class="modal"><div class="row"><h2 id="mtitle">Ajouter une activité</h2><button class="btn" id="x">✕</button></div><div id="mbody"></div><div class="modalfoot"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button></div></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),STORE="tempsMoi.v1";
const days=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const initial={
goals:{study:300,sport:120},
tasks:[
{ id:1,day:0,start:"07:00",end:"08:00",name:"Routine matin & petit-déjeuner",type:"Repos"},
{ id:2,day:0,start:"08:00",end:"10:30",name:"Études / Travail — Session 1",type:"Études"},
{ id:3,day:0,start:"10:30",end:"11:00",name:"Pause & hydratation",type:"Pause"},
{ id:4,day:0,start:"11:00",end:"12:30",name:"Études / Travail — Session 2",type:"Études"},
{ id:5,day:0,start:"12:30",end:"14:00",name:"Déjeuner & repos",type:"Pause"},
{ id:6,day:0,start:"14:00",end:"15:00",name:"Révisions — fiches & mémoire",type:"Études"},
{ id:7,day:0,start:"15:00",end:"17:00",name:"Temps libre / tâches perso",type:"Repos"},
{ id:8,day:0,start:"17:00",end:"19:00",name:"Sport — musculation / cardio",type:"Sport"},
{ id:9,day:0,start:"19:00",end:"20:30",name:"Douche & dîner",type:"Pause"},
{ id:10,day:0,start:"20:30",end:"22:30",name:"Détente / lecture",type:"Repos"}
],sessions:[],checks:{},notes:{},timer:{running:false,startedAt:null,elapsed:0,taskId:null},monthOffset:0
};
// Décliner le planning type sur les six jours actifs et réserver le dimanche à la récupération.
initial.tasks = [0,1,2,3,4,5].flatMap(day => initial.tasks.map((t,i) => ({
  ...t, id: day*100+i+1, day,
  name: day===5 && t.type==="Études" ? t.name.replace("Session 1","Synthèse semaine").replace("Session 2","Exercices / projets") : t.name
}))).concat([
  {id:701,day:6,start:"08:00",end:"10:00",name:"Repos / grasse matinée",type:"Repos"},
  {id:702,day:6,start:"10:00",end:"12:00",name:"Temps libre / famille",type:"Repos"},
  {id:703,day:6,start:"14:00",end:"15:00",name:"Lecture / détente",type:"Repos"},
  {id:704,day:6,start:"17:00",end:"17:30",name:"Étirements doux",type:"Sport"},
  {id:705,day:6,start:"20:30",end:"21:30",name:"Préparation de la semaine",type:"Autre"}
]);
let data=load(),page="home",editId=null;
function load(){try{return {...structuredClone(initial),...JSON.parse(localStorage.getItem(STORE)||"{}")}}catch{return structuredClone(initial)}}
function save(){localStorage.setItem(STORE,JSON.stringify(data))}
function pad(n){return String(n).padStart(2,"0")}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function todayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateFor(day,weekShift=0){let d=new Date();let wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+day+weekShift*7);return d}
function weekKey(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return todayKey(x)}
function secsToday(type){let key=todayKey();return data.sessions.filter(s=>s.date===key&&(!type||s.type===type)).reduce((a,s)=>a+s.seconds,0)+(data.timer.running&&data.timer.taskId&&data.tasks.find(t=>t.id===data.timer.taskId)?.type===type&&data.timer.date===key?Math.floor((Date.now()-data.timer.startedAt)/1000):0)}
function allSecs(type){return data.sessions.filter(s=>!type||s.type===type).reduce((a,s)=>a+s.seconds,0)}
function hms(m){return fmt(m*60).slice(0,5)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function typeClass(t){return t==="Sport"?"sport":t==="Pause"||t==="Repos"?"rest":""}
function currentElapsed(){return data.timer.elapsed+(data.timer.running?Math.floor((Date.now()-data.timer.startedAt)/1000):0)}
function goalsView(type){let val=secsToday(type),goal=(type==="Études"?data.goals.study:data.goals.sport)*60,p=Math.min(100,Math.round(val/goal*100));return `<div class="row"><b>${type==="Études"?"📚 Études / travail":"💪 Sport"}</b><span>${fmt(val)} / ${fmt(goal)}</span></div><div class="progress"><i style="width:${p}%"></i></div>`}
function dashboard(){let st=secsToday("Études"),sp=secsToday("Sport"),weekStart=dateFor(0),wk=weekKey(weekStart),weekStudy=data.sessions.filter(s=>s.week===wk&&s.type==="Études").reduce((a,s)=>a+s.seconds,0),weekSport=data.sessions.filter(s=>s.week===wk&&s.type==="Sport").reduce((a,s)=>a+s.seconds,0);
return `<div class="cards"><div class="card metric"><small>Études aujourd'hui</small><strong>${fmt(st)}</strong><span class="muted">Objectif ${data.goals.study/60} h</span></div><div class="card metric"><small>Sport aujourd'hui</small><strong>${fmt(sp)}</strong><span class="muted">Objectif ${data.goals.sport/60} h</span></div><div class="card metric"><small>Temps total enregistré</small><strong>${fmt(allSecs())}</strong><span class="muted">Depuis le début du suivi</span></div><div class="card metric"><small>Activités planifiées</small><strong>${data.tasks.length}</strong><span class="muted">Blocs personnalisables</span></div></div>
<div class="layout"><div class="panel"><h3>🎯 Mes objectifs du jour</h3>${goalsView("Études")}${goalsView("Sport")}<div class="muted">Cette semaine : études ${fmt(weekStudy)} · sport ${fmt(weekSport)}</div><div style="margin-top:16px"><button class="btn primary" onclick="go('timerpage')">Lancer une session</button> <button class="btn" onclick="go('week')">Voir mon planning</button></div></div>
<div class="timer"><div class="muted">CHRONOMÈTRE EN COURS</div><div class="time" id="liveTime">${fmt(currentElapsed())}</div><div class="muted" id="liveLabel">${data.timer.taskId?esc(data.tasks.find(t=>t.id===data.timer.taskId)?.name||"Session libre"):"Aucune session sélectionnée"}</div><select id="dashTask">${taskOptions()}</select><button class="btn greenbtn" id="dashStart">${data.timer.running?"Pause":"Démarrer"}</button> <button class="btn" id="dashStop">Terminer</button></div>
<div class="panel"><h3>📌 Prochaines activités du jour</h3>${todayTasks().map(t=>`<div class="goal row"><div><b>${esc(t.start)} – ${esc(t.end)}</b><div class="muted">${esc(t.name)}</div></div><span class="pill">${esc(t.type)}</span></div>`).join("")||'<div class="empty">Aucune activité prévue.</div>'}</div>
<div class="panel"><h3>📅 Régularité de la semaine</h3>${days.map((d,i)=>{let date=dateFor(i),key=todayKey(date),n=data.sessions.filter(s=>s.date===key).reduce((a,s)=>a+s.seconds,0);return `<div class="row goal"><b>${d}</b><span class="muted">${fmt(n)}</span></div>`}).join("")}</div></div>`}
function todayTasks(){let d=(new Date().getDay()+6)%7;return data.tasks.filter(t=>t.day===d).sort((a,b)=>a.start.localeCompare(b.start))}
function taskOptions(){return `<option value="">Session libre (choisir une catégorie)</option>`+data.tasks.map(t=>`<option value="${t.id}" ${data.timer.taskId===t.id?"selected":""}>${days[t.day]} · ${t.start} · ${esc(t.name)}</option>`).join("")}
function weekView(){return `<div class="toolbar"><button class="btn" id="prevWeek">← Semaine précédente</button><button class="btn" id="thisWeek">Cette semaine</button><button class="btn" id="nextWeek">Semaine suivante →</button><span class="muted" id="weekLabel"></span></div><div class="tablewrap"><table class="schedule"><thead><tr><th>Créneau</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${uniqueSlots().map(slot=>`<tr><th>${slot}</th>${days.map((d,i)=>{let t=data.tasks.find(x=>x.day===i&&x.start+" – "+x.end===slot);return `<td>${t?`<div class="slot ${typeClass(t.type)}" data-task="${t.id}"><b>${esc(t.name)}</b><small>${esc(t.type)}</small></div>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" id="addTask">＋ Ajouter un bloc horaire</button><button class="btn" id="resetWeek">Restaurer le planning type</button></div><div class="muted">Clique sur un bloc pour le modifier. Le chronomètre comptabilise le temps réellement effectué, pas simplement le temps prévu.</div>`}
function uniqueSlots(){return [...new Set(data.tasks.map(t=>t.start+" – "+t.end))].sort((a,b)=>a.localeCompare(b))}
function timerPage(){return `<div class="layout"><div class="timer"><div class="muted">CHRONOMÈTRE DE SESSION</div><div class="time" id="liveTime">${fmt(currentElapsed())}</div><div class="muted" id="liveLabel">${data.timer.taskId?esc(data.tasks.find(t=>t.id===data.timer.taskId)?.name||"Session libre"):"Choisis une activité pour commencer"}</div><select id="timerTask">${taskOptions()}</select><select id="timerType"><option>Études</option><option>Sport</option><option>Autre</option></select><div><button class="btn greenbtn" id="timerStart">${data.timer.running?"Mettre en pause":"Démarrer"}</button> <button class="btn" id="timerFinish">Terminer & enregistrer</button><button class="btn" id="timerReset">Réinitialiser</button></div></div><div class="panel"><h3>🎯 Progression du jour</h3>${goalsView("Études")}${goalsView("Sport")}<div class="notice">Conseil : démarre le chronomètre au début de ton activité et termine la session à la fin. Une pause ne compte pas dans ton temps de travail.</div><h3>Dernières sessions</h3>${data.sessions.slice(-5).reverse().map(s=>`<div class="goal row"><div><b>${esc(s.name)}</b><div class="muted">${s.date} · ${s.type}</div></div><b>${fmt(s.seconds)}</b></div>`).join("")||'<div class="empty">Aucune session enregistrée.</div>'}</div></div>`}
function monthView(){let d=new Date();d.setMonth(d.getMonth()+data.monthOffset);let year=d.getFullYear(),month=d.getMonth(),monthName=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),first=new Date(year,month,1),count=new Date(year,month+1,0).getDate(),html="";
for(let day=1;day<=count;day++){let date=new Date(year,month,day),key=todayKey(date),dow=(date.getDay()+6)%7,study=data.sessions.filter(s=>s.date===key&&s.type==="Études").reduce((a,s)=>a+s.seconds,0),sport=data.sessions.filter(s=>s.date===key&&s.type==="Sport").reduce((a,s)=>a+s.seconds,0),ck=data.checks[key]||{};html+=`<div class="checkrow"><b>${days[dow]} ${pad(day)}</b><label><input type="checkbox" data-check="${key}:study" ${ck.study?"checked":""}> Études ${fmt(study)}</label><label><input type="checkbox" data-check="${key}:sport" ${ck.sport?"checked":""}> Sport ${fmt(sport)}</label><div class="notescol"><input class="note" data-note="${key}" placeholder="Note / bilan du jour…" value="${esc(data.notes[key]||"")}"></div></div>`}
return `<div class="toolbar"><button class="btn" id="prevMonth">←</button><b style="text-transform:capitalize">${monthName}</b><button class="btn" id="nextMonth">→</button><button class="btn" id="monthNow">Ce mois-ci</button></div><div class="panel" style="padding:0;overflow:hidden"><div class="checkrow head"><span>Jour</span><span>📚 Études / travail</span><span>💪 Sport</span><span class="notescol">Notes / bilan</span></div>${html}</div><p class="muted">Les cases de validation sont indépendantes du chronomètre : coche-les quand tu estimes avoir atteint ton objectif. Les durées sont calculées automatiquement à partir des sessions enregistrées.</p>`}
function historyPage(){let groups={};data.sessions.forEach(s=>(groups[s.date]??=[]).push(s));return `<div class="panel"><h3>Historique des sessions</h3>${Object.keys(groups).sort().reverse().map(date=>`<div class="goal"><b>${date}</b>${groups[date].map(s=>`<div class="row" style="padding:6px 0"><span>${esc(s.name)} <span class="pill">${esc(s.type)}</span></span><b>${fmt(s.seconds)}</b></div>`).join("")}</div>`).join("")||'<div class="empty">Aucune session. Lance ton premier chronomètre !</div>'}</div>`}

function streakCount(){
 let count=0,d=new Date();
 const valid=k=>{const a=data.sessions.filter(s=>s.date===k&&s.type==="Études").reduce((n,s)=>n+s.seconds,0),b=data.sessions.filter(s=>s.date===k&&s.type==="Sport").reduce((n,s)=>n+s.seconds,0),c=data.checks[k]||{};return (a>=data.goals.study*60||c.study)&&(b>=data.goals.sport*60||c.sport)};
 if(!valid(todayKey(d)))d.setDate(d.getDate()-1);
 while(count<366&&valid(todayKey(d))){count++;d.setDate(d.getDate()-1)}
 return count;
}
function statsPage(){
 const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1),ms=data.sessions.filter(s=>new Date(s.date+"T12:00:00")>=start);
 const st=ms.filter(s=>s.type==="Études").reduce((a,s)=>a+s.seconds,0),sp=ms.filter(s=>s.type==="Sport").reduce((a,s)=>a+s.seconds,0),active=new Set(ms.map(s=>s.date)).size;
 const labels=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);labels.push({label:d.toLocaleDateString("fr-FR",{weekday:"short"}),key:todayKey(d)})}
 const totals=(key,type)=>data.sessions.filter(s=>s.date===key&&s.type===type).reduce((a,s)=>a+s.seconds,0)/3600;
 return `<div class="cards"><div class="card metric"><small>Jours consécutifs validés</small><strong>🔥 ${streakCount()}</strong><span class="muted">Série actuelle</span></div><div class="card metric"><small>Études ce mois</small><strong>${fmt(st)}</strong><span class="muted">Temps enregistré</span></div><div class="card metric"><small>Sport ce mois</small><strong>${fmt(sp)}</strong><span class="muted">Temps enregistré</span></div><div class="card metric"><small>Jours actifs ce mois</small><strong>${active}</strong><span class="muted">Avec au moins une session</span></div></div>
 <div class="layout"><div class="panel"><div class="row"><h3>📊 Progression des 7 derniers jours</h3><span class="pill">Heures / jour</span></div><canvas id="progressChart" height="220" style="width:100%;max-height:260px"></canvas><div class="muted">Temps réellement enregistré : bleu = études, vert = sport.</div></div>
 <div class="panel"><h3>🎯 Bilan du mois en cours</h3><div class="goal"><div class="row"><b>Études / travail</b><b>${fmt(st)}</b></div><div class="progress"><i style="width:${Math.min(100,st/(data.goals.study*60*Math.max(1,now.getDate()))*100)}%"></i></div></div><div class="goal"><div class="row"><b>Sport</b><b>${fmt(sp)}</b></div><div class="progress"><i style="width:${Math.min(100,sp/(Math.max(1,data.goals.sport)*60*Math.max(1,now.getDate()))*100)}%"></i></div></div><p class="muted">Progression par rapport aux objectifs cumulés depuis le début du mois.</p><button class="btn primary" id="printReport">Imprimer / enregistrer en PDF</button> <button class="btn" id="csvReport">Exporter les sessions en CSV</button></div></div>
 <div class="panel" style="margin-top:15px"><h3>📅 Résumé des 7 derniers jours</h3>${labels.map(v=>`<div class="goal row"><b>${v.label}</b><span class="muted">📚 ${totals(v.key,"Études").toFixed(1)} h　💪 ${totals(v.key,"Sport").toFixed(1)} h</span></div>`).join("")}</div>`;
}
function drawStats(){
 const c=$("progressChart");if(!c)return;const w=Math.max(300,c.getBoundingClientRect().width),h=220,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
 const L=34,R=12,T=18,B=30,cw=w-L-R,ch=h-T-B;let labels=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);labels.push({key:todayKey(d),name:d.toLocaleDateString("fr-FR",{weekday:"short"})})}
 const val=(k,t)=>data.sessions.filter(s=>s.date===k&&s.type===t).reduce((a,s)=>a+s.seconds,0)/3600;
 const max=Math.max(2,...labels.flatMap(v=>[val(v.key,"Études"),val(v.key,"Sport")]));
 x.font="11px Segoe UI";x.strokeStyle="#e7edf4";x.fillStyle="#718096";
 for(let i=0;i<=4;i++){let y=T+ch*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillText((max*(1-i/4)).toFixed(1),2,y+4)}
 const step=cw/7,bw=Math.min(17,step/3);
 labels.forEach((v,i)=>{let base=L+i*step+step/2,a=val(v.key,"Études"),b=val(v.key,"Sport");x.fillStyle="#3478d4";x.fillRect(base-bw-2,T+ch-a/max*ch,bw,a/max*ch);x.fillStyle="#20a47b";x.fillRect(base+2,T+ch-b/max*ch,bw,b/max*ch);x.fillStyle="#718096";x.textAlign="center";x.fillText(v.name,base,h-8)});
 x.textAlign="left";x.fillStyle="#3478d4";x.fillRect(L,3,9,9);x.fillStyle="#718096";x.fillText("Études",L+13,12);x.fillStyle="#20a47b";x.fillRect(L+72,3,9,9);x.fillStyle="#718096";x.fillText("Sport",L+85,12);
}
function settings(){return `<div class="panel" style="max-width:650px"><h3>Mes objectifs quotidiens</h3><div class="form"><div class="group"><label>Études / travail (heures)</label><input id="goalStudy" type="number" min="0.5" max="24" step=".5" value="${data.goals.study/60}"></div><div class="group"><label>Sport (heures)</label><input id="goalSport" type="number" min="0" max="24" step=".5" value="${data.goals.sport/60}"></div></div><button class="btn primary" id="saveGoals" style="margin-top:13px">Enregistrer les objectifs</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Rappels quotidiens</h3><div class="form"><div class="group"><label>Heure du rappel</label><input id="reminderTime" type="time" value="${data.reminderTime||"08:00"}"></div><div class="group"><label>Notifications navigateur</label><select id="reminderEnabled"><option value="no" ${data.reminderEnabled?"":"selected"}>Désactivées</option><option value="yes" ${data.reminderEnabled?"selected":""}>Activées</option></select></div></div><button class="btn" id="saveReminder" style="margin-top:12px">Enregistrer les rappels</button><p class="muted">La page doit rester ouverte et l'autorisation de notification doit être accordée.</p><h3>Données personnelles</h3><p class="muted">Les informations sont conservées dans le stockage local de ce navigateur. Elles ne sont envoyées sur aucun serveur.</p><button class="btn" id="backup">Télécharger une sauvegarde JSON</button> <label class="btn" for="restore">Restaurer une sauvegarde</label><input id="restore" type="file" accept=".json" hidden><button class="btn" id="resetData">Réinitialiser les données</button></div>`}
const meta={home:["Tableau de bord","Bonjour, prêt à progresser ?","Organise tes journées, lance le chronomètre et observe tes progrès."],week:["Emploi du temps","Mon planning hebdomadaire","Modifie les blocs selon ton rythme et tes priorités."],timerpage:["Chronomètre","Suivre une activité","Le temps réellement effectué est ajouté à tes statistiques."],month:["Suivi mensuel","Mon bilan du mois","Valide tes objectifs quotidiens et ajoute tes notes."],history:["Historique","Mes sessions enregistrées","Retrouve les temps de travail et d'entraînement réalisés."],settings:["Objectifs & réglages","Personnaliser mon suivi","Adapte tes objectifs et gère tes sauvegardes."]};
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("crumb").textContent=meta[p][0];$("title").textContent=meta[p][1];$("subtitle").textContent=meta[p][2];$("sidebar").classList.remove("open");render()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));$("hamb").onclick=()=>$("sidebar").classList.toggle("open");
function render(){let v=$("view");v.innerHTML=page==="home"?dashboard():page==="week"?weekView():page==="timerpage"?timerPage():page==="month"?monthView():page==="history"?historyPage():page==="stats"?statsPage():settings();bind();if(page==="stats"){drawStats();window.addEventListener("resize",drawStats,{once:true})}}
function bind(){if(page==="home"||page==="timerpage"){let sel=$(page==="home"?"dashTask":"timerTask");if(sel)sel.onchange=()=>{if(data.timer.running){alert("Mets le chronomètre en pause avant de changer d'activité.");sel.value=data.timer.taskId||"";return}data.timer.taskId=sel.value?+sel.value:null;save();render()};let start=$(page==="home"?"dashStart":"timerStart");if(start)start.onclick=toggleTimer;let stop=$(page==="home"?"dashStop":"timerFinish");if(stop)stop.onclick=finishTimer;if(page==="timerpage")$("timerReset").onclick=resetTimer}
if(page==="week"){$("addTask").onclick=()=>openTask();$("resetWeek").onclick=()=>{if(confirm("Restaurer le planning type ?")){data.tasks=structuredClone(initial.tasks);save();render()}};document.querySelectorAll("[data-task]").forEach(el=>el.onclick=()=>openTask(+el.dataset.task))}
if(page==="month"){document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{let [key,k]=el.dataset.check.split(":");data.checks[key]??={};data.checks[key][k]=el.checked;save()});document.querySelectorAll("[data-note]").forEach(el=>el.onchange=()=>{data.notes[el.dataset.note]=el.value;save()});$("prevMonth").onclick=()=>{data.monthOffset--;render()};$("nextMonth").onclick=()=>{data.monthOffset++;render()};$("monthNow").onclick=()=>{data.monthOffset=0;render()}}
if(page==="stats"){$("printReport").onclick=()=>window.print();$("csvReport").onclick=exportCSV}
if(page==="settings"){$("saveReminder").onclick=async()=>{data.reminderTime=$("reminderTime").value;data.reminderEnabled=$("reminderEnabled").value==="yes";if(data.reminderEnabled&&"Notification" in window){const p=await Notification.requestPermission();if(p!=="granted"){data.reminderEnabled=false;alert("Autorisation refusée. Active les notifications dans les réglages du navigateur.");}}else if(data.reminderEnabled){data.reminderEnabled=false;alert("Notifications non prises en charge par ce navigateur.");}save();render();};$("saveGoals").onclick=()=>{data.goals.study=Math.max(30,+$("goalStudy").value*60);data.goals.sport=Math.max(0,+$("goalSport").value*60);save();render()};$("backup").onclick=backup;$("restore").onchange=restore;$("resetData").onclick=reset}
if(page==="home"){$("dashStart").onclick=toggleTimer;$("dashStop").onclick=finishTimer}}
function toggleTimer(){if(data.timer.running){data.timer.elapsed=currentElapsed();data.timer.running=false;data.timer.startedAt=null}else{let sel=$(page==="home"?"dashTask":"timerTask");if(sel&&sel.value)data.timer.taskId=+sel.value;data.timer.running=true;data.timer.startedAt=Date.now();data.timer.date=todayKey();data.timer.type=data.timer.taskId?(data.tasks.find(t=>t.id===data.timer.taskId)?.type||"Autre"):(page==="timerpage"?$("timerType").value:"Autre");data.timer.name=data.timer.taskId?(data.tasks.find(t=>t.id===data.timer.taskId)?.name||"Session"):"Session libre"}save();render()}
function finishTimer(){let sec=currentElapsed();if(data.timer.running||sec>0){if(sec>0)data.sessions.push({id:Date.now(),date:data.timer.date||todayKey(),week:weekKey(new Date((data.timer.date||todayKey())+"T00:00:00")),seconds:sec,type:data.timer.type||"Autre",name:data.timer.name||"Session libre"});data.timer={running:false,startedAt:null,elapsed:0,taskId:null};save();render();alert(sec>0?"Session enregistrée : "+fmt(sec):"Chronomètre arrêté.")}else alert("Aucun temps à enregistrer.")}
function resetTimer(){if(confirm("Effacer le temps de cette session non enregistrée ?")){data.timer={running:false,startedAt:null,elapsed:0,taskId:null};save();render()}}
function openTask(id=null){editId=id;let t=id?data.tasks.find(x=>x.id===id):{day:0,start:"08:00",end:"09:00",name:"",type:"Études"};$("mtitle").textContent=id?"Modifier le bloc horaire":"Ajouter un bloc horaire";$("mbody").innerHTML=`<form id="taskForm" class="form"><div class="group"><label>Jour</label><select name="day">${days.map((d,i)=>`<option value="${i}" ${t.day===i?"selected":""}>${d}</option>`).join("")}</select></div><div class="group"><label>Catégorie</label><select name="type">${["Études","Sport","Pause","Repos","Autre"].map(x=>`<option ${t.type===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="group"><label>Heure de début</label><input name="start" type="time" value="${t.start}" required></div><div class="group"><label>Heure de fin</label><input name="end" type="time" value="${t.end}" required></div><div class="group full"><label>Activité</label><input name="name" value="${esc(t.name)}" required></div></form>${id?'<button class="btn" id="deleteTask" style="margin-top:12px">Supprimer ce bloc</button>':''}`;$("modal").classList.add("show");if(id)$("deleteTask").onclick=()=>{if(confirm("Supprimer ce bloc ?")){data.tasks=data.tasks.filter(x=>x.id!==id);save();closeModal();render()}}}
function closeModal(){$("modal").classList.remove("show")}$("x").onclick=$("cancel").onclick=closeModal;
$("save").onclick=()=>{let f=$("taskForm");if(!f)return;if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f));x.day=+x.day;if(x.end<=x.start){alert("L'heure de fin doit être après l'heure de début.");return}if(editId){Object.assign(data.tasks.find(t=>t.id===editId),x)}else data.tasks.push({id:Date.now(),...x});data.tasks.sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));save();closeModal();render()};
function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="mon-planning-sauvegarde.json";a.click();URL.revokeObjectURL(u)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.tasks||!d.sessions||!d.goals)throw Error();data={...structuredClone(initial),...d};save();render();alert("Sauvegarde restaurée.")}catch{alert("Fichier de sauvegarde invalide.")}};r.readAsText(f)}
function reset(){if(confirm("Supprimer les sessions, notes et réglages et restaurer les exemples ?")){data=structuredClone(initial);save();render()}}
function exportData(){backup()}
function exportCSV(){
 const rows=[["Date","Activité","Catégorie","Durée (secondes)"],...data.sessions.map(s=>[s.date,s.name,s.type,s.seconds])];
 const csv="\\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\\r\\n");
 const a=document.createElement("a"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.href=u;a.download="rapport-sessions.csv";a.click();URL.revokeObjectURL(u);
}
let lastReminder="";
setInterval(()=>{if(!data.reminderEnabled||!("Notification" in window)||Notification.permission!=="granted")return;const n=new Date(),key=todayKey(n)+" "+pad(n.getHours())+":"+pad(n.getMinutes());if(key.endsWith(data.reminderTime||"08:00")&&lastReminder!==key){lastReminder=key;new Notification("Temps & Moi",{body:"Consulte ton planning et commence ta prochaine activité !"});}},15000);
$("quick").onclick=()=>{go("week");openTask()};$("export").onclick=exportData;
$("today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
setInterval(()=>{let el=$("liveTime");if(el)el.textContent=fmt(currentElapsed());},500);
render();save();
</script></body></html>
