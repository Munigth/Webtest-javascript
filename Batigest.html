<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BatiGest Pro — Gestion technique des bâtiments</title>
<style>
:root{--navy:#142b45;--blue:#2878d0;--cyan:#18a6b5;--bg:#f3f6fa;--line:#e1e8f0;--muted:#718096;--green:#16845e;--red:#b83e4b;--gold:#c58a28}
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:#24364a}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#fff;padding:20px 14px;flex-shrink:0}.brand{font-size:20px;font-weight:900;padding:6px 10px 24px}.brand span{color:#36c1ce}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#9db2c8}.nav small{display:block;color:#90a7bd;padding:14px 12px 5px;letter-spacing:1px;font-size:10px}.nav button{width:100%;display:block;text-align:left;padding:11px 12px;border:0;border-radius:8px;background:none;color:#cfdae5;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.main{flex:1;min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.content{padding:24px;max-width:1600px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.head h1{margin:0 0 4px;font-size:25px}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;background:#edf2f7;color:#38516a}.primary{background:var(--blue);color:#fff}.danger{background:#ffeded;color:var(--red)}.success{background:#e6f7ef;color:var(--green)}.gold{background:#fff4df;color:#936315}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 5px 20px #16314c08}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.field,input,select,textarea{border:1px solid #d6e0ea;border-radius:8px;padding:10px;background:#fff;color:#24364a;font:inherit}.search{min-width:220px}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:780px}.table th{text-align:left;background:#f8fafc;color:#718096;font-size:10px;text-transform:uppercase;padding:12px}.table td{border-top:1px solid #edf1f5;padding:11px;font-size:12px}.table td b{font-size:13px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf2f7}.green{background:#e5f7ee;color:#16845e}.blue{background:#e7f1ff;color:#276ab0}.orange{background:#fff2dc;color:#a66d18}.red{background:#ffeded;color:#b34242}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:6px;padding:6px 8px;cursor:pointer}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{background:#eef7ff;border:1px solid #d6e8f8;border-radius:9px;padding:12px;color:#42617d;margin-bottom:14px;font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.group{display:flex;flex-direction:column;gap:5px}.group label{font-size:11px;font-weight:700;color:#52667b}.group input,.group select,.group textarea{width:100%}.full{grid-column:1/-1}.modalbg{display:none;position:fixed;inset:0;background:#10243b99;z-index:8;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:#fff;border-radius:13px;padding:20px;width:min(720px,100%);max-height:92vh;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.tabs button.active{background:#e8f2ff;border-color:#9bc5f0;color:#1f65a7}.bar{height:8px;background:#edf1f5;border-radius:10px;overflow:hidden;margin:7px 0 14px}.bar i{display:block;height:100%;background:var(--cyan)}.floorplan{width:100%;height:540px;background-color:#fff;background-image:linear-gradient(#e8edf3 1px,transparent 1px),linear-gradient(90deg,#e8edf3 1px,transparent 1px);background-size:20px 20px;border:1px solid #dce4ed;border-radius:10px;touch-action:pan-y}.floorplan svg{width:100%;height:100%;cursor:crosshair}.plan-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.plan-tools button{font-size:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}.legend span{display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.listline{padding:10px 0;border-bottom:1px solid #edf1f5}.mobile{display:none}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:680px){.side{position:fixed;z-index:6;top:0;bottom:0;left:-255px;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.content{padding:15px 11px}.top{padding:0 10px}.head{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.full{grid-column:auto}.stats{gap:8px}.stat strong{font-size:20px}.floorplan{height:420px}}
@media print{.side,.top,.head button,.toolbar,.no-print{display:none!important}.content{padding:0;max-width:none}.panel,.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style></head>
<body><div class="app">
<aside class="side" id="side"><div class="brand">🏗 BATI<span>GEST</span><small>PRO · GESTION TECHNIQUE</small></div><nav class="nav">
<small>PATRIMOINE</small><button data-page="dashboard" class="active">▦ Tableau de bord</button><button data-page="buildings">🏢 Bâtiments, étages & locaux</button><button data-page="installations">🔧 Installations techniques</button><button data-page="plans">📐 Plans & schémas</button>
<small>CHANTIER</small><button data-page="projects">📁 Projets & chantiers</button><button data-page="team">👷 Équipe & entreprises</button><button data-page="equipment">📦 Équipements & stock</button><button data-page="documents">🧾 Devis, factures & réception</button>
<small>ADMINISTRATION</small><button data-page="reports">📊 Rapports</button><button data-page="settings">⚙ Paramètres & sauvegarde</button></nav>
<div class="muted" style="color:#9eb3c8;margin:30px 8px">BatiGest Pro 2.0<br>Mode démonstration local</div></aside>
<section class="main"><header class="top"><div><button class="btn mobile" id="menu">☰</button>　<b id="crumb">Tableau de bord</b></div><div class="muted">● <span id="mode">Données locales</span>　<strong>BG</strong></div></header>
<main class="content"><div class="head"><div><h1 id="title">Vue générale</h1><div class="muted" id="subtitle">Gérez vos bâtiments, installations, équipes et documents.</div></div><div><button class="btn" id="export">⇩ Exporter CSV</button> <button class="btn primary" id="add">＋ Nouvelle entrée</button></div></div><div id="view"></div></main></section></div>
<div class="modalbg" id="modal"><div class="modal"><div class="row"><h2 id="modalTitle">Nouvelle entrée</h2><button class="btn" id="close">✕</button></div><div id="modalBody"></div><div class="modalfoot"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button></div></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),KEY="batigest_pro_v2";
const categories=["Électricité","Plomberie","Réseau informatique","Climatisation","Sécurité incendie","Contrôle d'accès","Vidéosurveillance","Mobilier","Autre"];
const roles=["Administrateur","Chef de chantier","Technicien","Magasinier"];
const seed={
 buildings:[{id:1,name:"Résidence Les Palmiers",type:"Immeuble résidentiel",address:"Douala, Akwa",manager:"Jean M."},{id:2,name:"Bureaux Horizon",type:"Bâtiment professionnel",address:"Douala, Bonanjo",manager:"Mme Tchoumi"}],
 floors:[{id:11,buildingId:1,name:"Rez-de-chaussée",level:0},{id:12,buildingId:1,name:"Étage 1",level:1},{id:13,buildingId:1,name:"Étage 2",level:2},{id:21,buildingId:2,name:"Rez-de-chaussée",level:0}],
 rooms:[{id:111,floorId:11,name:"Hall d'entrée",kind:"Hall",surface:45},{id:112,floorId:11,name:"Local technique",kind:"Local technique",surface:12},{id:121,floorId:12,name:"Bureau 1",kind:"Bureau",surface:22},{id:122,floorId:12,name:"Sanitaires",kind:"Sanitaires",surface:9},{id:131,floorId:13,name:"Appartement 2A",kind:"Appartement",surface:75}],
 installations:[{id:1,title:"Tableau électrique principal",category:"Électricité",buildingId:1,floorId:11,roomId:112,technician:"Paul E.",company:"ElecPro",status:"En cours",priority:"Haute",reference:"ELEC-TGBT-001",date:"2026-11-12",notes:"Contrôle des départs et repérage."},{id:2,title:"Prises RJ45 Cat6",category:"Réseau informatique",buildingId:2,floorId:21,roomId:null,technician:"Mireille N.",company:"NetPro",status:"Planifié",priority:"Normale",reference:"NET-RJ45-014",date:"2026-11-20",notes:"12 prises à installer."},{id:3,title:"Collecteur eau froide",category:"Plomberie",buildingId:1,floorId:13,roomId:131,technician:"Ali P.",company:"HydroBat",status:"Terminé",priority:"Normale",reference:"PLB-COL-003",date:"2026-11-10",notes:"Essai de pression effectué."}],
 projects:[{id:1,name:"Rénovation technique – Palmiers",client:"Syndic Les Palmiers",buildingId:1,budget:4500000,status:"En cours",start:"2026-11-01",end:"2026-12-15"}],
 team:[{id:1,name:"Paul E.",role:"Technicien",company:"ElecPro",phone:"6 99 00 00 01",email:"paul@example.com"},{id:2,name:"Mireille N.",role:"Technicien",company:"NetPro",phone:"6 77 00 00 02",email:"mireille@example.com"},{id:3,name:"Jean M.",role:"Chef de chantier",company:"BatiGest",phone:"6 90 00 00 03",email:"jean@example.com"}],
 companies:[{id:1,name:"ElecPro",specialty:"Électricité",contact:"M. Paul",phone:"6 99 00 00 01"},{id:2,name:"HydroBat",specialty:"Plomberie",contact:"Mme Ali",phone:"6 77 00 00 04"},{id:3,name:"NetPro",specialty:"Réseau informatique",contact:"M. Nono",phone:"6 77 00 00 05"}],
 equipment:[{id:1,name:"Câble électrique 2,5 mm²",category:"Électricité",quantity:8,unit:"Rouleaux",min:3,unitPrice:28000},{id:2,name:"Tube PVC Ø32",category:"Plomberie",quantity:12,unit:"Barres",min:5,unitPrice:4500},{id:3,name:"Connecteur RJ45 Cat6",category:"Réseau informatique",quantity:18,unit:"Pièces",min:20,unitPrice:1200}],
 documents:[{id:1,kind:"Devis",number:"DEV-2026-001",client:"Syndic Les Palmiers",object:"Rénovation technique",amount:1250000,status:"En attente",date:"2026-11-14"},{id:2,kind:"Fiche de réception",number:"REC-2026-001",client:"Bureaux Horizon",object:"Câblage étage 1",amount:0,status:"À signer",date:"2026-11-10"}],
 planItems:[{id:1,buildingId:1,floorId:12,roomId:121,type:"Prise électrique",x:28,y:34,label:"PC-01"},{id:2,buildingId:1,floorId:12,roomId:121,type:"Interrupteur",x:72,y:35,label:"INT-01"},{id:3,buildingId:1,floorId:12,roomId:121,type:"Luminaire",x:50,y:58,label:"LUM-01"}],
 planLines:[],settings:{company:"BatiGest Pro",currency:"FCFA"},users:[{id:1,name:"Administrateur démo",username:"admin",role:"Administrateur"}]
};
let db=load(),page="dashboard",edit={type:null,id:null},planTool="select",selectedPlan=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.buildings?{...structuredClone(seed),...x}:structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return new Intl.NumberFormat("fr-FR").format(+v||0)+" "+(db.settings.currency||"FCFA")}
function date(v){return v?new Date(v+"T12:00:00").toLocaleDateString("fr-FR"):"—"}
function badge(s){let c=s==="Terminé"||s==="Accepté"?"green":s==="En cours"?"blue":s==="Bloqué"||s==="Refusé"?"red":"orange";return `<span class="badge ${c}">${esc(s||"—")}</span>`}
function buildingName(i){return db.buildings.find(x=>x.id==i)?.name||"—"}
function floorName(i){return db.floors.find(x=>x.id==i)?.name||"—"}
function roomName(i){return db.rooms.find(x=>x.id==i)?.name||"Zone générale"}
function meta(p){return ({dashboard:["Tableau de bord","Vue générale","Indicateurs et alertes de vos chantiers."],buildings:["Bâtiments & locaux","Gestion du patrimoine","Bâtiments, niveaux, pièces et locaux techniques."],installations:["Installations","Registre technique","Localisez chaque intervention et affectez les intervenants."],plans:["Plans & schémas","Éditeur de plans interactif","Placez des symboles techniques et tracez des réseaux sur le plan."],projects:["Projets & chantiers","Suivi des projets","Clients, budgets et délais."],team:["Équipe & entreprises","Annuaire professionnel","Techniciens, rôles et sociétés partenaires."],equipment:["Équipements & stock","Gestion du matériel","Quantités, seuils et valorisation."],documents:["Documents commerciaux","Devis, factures et réceptions","Préparez et imprimez les documents de chantier."],reports:["Rapports","Synthèse & indicateurs","Avancement, coûts, stock et répartition par spécialité."],settings:["Paramètres","Configuration & sauvegarde","Données locales et préparation du serveur multi-postes."]})[p]}
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));let m=meta(p);$("crumb").textContent=m[0];$("title").textContent=m[1];$("subtitle").textContent=m[2];$("side").classList.remove("open");$("add").textContent="＋ "+({buildings:"Bâtiment",installations:"Installation",projects:"Projet",team:"Intervenant",equipment:"Matériel",documents:"Document"}[p]||"Nouvelle entrée");render()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));$("menu").onclick=()=>$("side").classList.toggle("open");
function table(headers,rows){return `<div class="tablebox"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Aucune donnée. Utilisez « Ajouter » pour commencer.</td></tr>`}</tbody></table></div>`}
function action(t,i){return `<span class="actions"><button data-edit="${t}" data-id="${i}">✎</button><button data-del="${t}" data-id="${i}">🗑</button></span>`}
function dashboard(){let active=db.installations.filter(x=>x.status==="En cours").length,stock=db.equipment.filter(x=>x.quantity<=x.min).length,cost=db.projects.reduce((a,x)=>a+(+x.budget||0),0);return `<div class="stats">${[["Bâtiments",db.buildings.length],["Installations",db.installations.length],["Interventions en cours",active],["Alertes de stock",stock]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}</div><div class="grid2"><div class="panel"><h3>Dernières installations</h3>${db.installations.slice(-6).reverse().map(x=>`<div class="listline row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.category)} · ${esc(buildingName(x.buildingId))} · ${esc(floorName(x.floorId))} · ${esc(roomName(x.roomId))}</div></div>${badge(x.status)}</div>`).join("")||'<div class="empty">Aucune installation.</div>'}</div><div class="panel"><h3>Résumé du portefeuille</h3><p class="muted">Budget total des projets</p><h2>${money(cost)}</h2><div class="bar"><i style="width:65%"></i></div><p class="muted">${db.projects.length} projet(s) · ${db.team.length} intervenant(s) · ${db.companies.length} entreprise(s)</p><h3 style="margin-top:22px">Alertes à traiter</h3>${db.equipment.filter(x=>x.quantity<=x.min).map(x=>`<div class="listline">⚠ ${esc(x.name)} — stock ${x.quantity} ${esc(x.unit)}</div>`).join("")||'<div class="muted">Aucune alerte de stock.</div>'}</div></div>`}
function buildingsView(){return `<div class="toolbar"><input class="field search" id="q" placeholder="Rechercher un bâtiment…"><button class="btn primary" id="addFloor">＋ Ajouter un étage</button><button class="btn" id="addRoom">＋ Ajouter une pièce</button></div><div id="buildingTable"></div><div class="panel" style="margin-top:14px"><h3>Structure des bâtiments</h3>${db.buildings.map(b=>`<details style="padding:9px 0;border-bottom:1px solid var(--line)" open><summary><b>🏢 ${esc(b.name)}</b> <span class="muted">${esc(b.address)}</span></summary>${db.floors.filter(f=>f.buildingId===b.id).map(f=>`<div style="margin:12px 0 12px 22px"><b>▰ ${esc(f.name)}</b><div class="muted">${db.rooms.filter(r=>r.floorId===f.id).map(r=>esc(r.name)+" ("+esc(r.kind)+")").join(" · ")||"Aucun local enregistré"}</div></div>`).join("")}</details>`).join("")||'<div class="empty">Ajoutez votre premier bâtiment.</div>'}</div>`}
function installationsView(){return `<div class="toolbar"><input class="field search" id="q" placeholder="Rechercher…"><select id="cat" class="field"><option value="">Toutes spécialités</option>${categories.map(x=>`<option>${x}</option>`).join("")}</select><select id="st" class="field"><option value="">Tous états</option>${["Planifié","En cours","Terminé","Bloqué"].map(x=>`<option>${x}</option>`).join("")}</select></div><div id="installTable"></div>`}
function teamView(){return `<div class="tabs"><button class="active" data-teamtab="team">Techniciens & responsables</button><button data-teamtab="companies">Entreprises</button><button data-teamtab="users">Comptes & rôles (démo)</button></div><div id="teamTable"></div>`}
function documentsView(){return `<div class="notice">Les documents sont des modèles de suivi. Vérifiez les taxes, mentions légales et conditions contractuelles avant toute émission officielle.</div><div class="toolbar"><select id="docFilter" class="field"><option value="">Tous les documents</option>${["Devis","Facture","Fiche de réception"].map(x=>`<option>${x}</option>`).join("")}</select></div><div id="docTable"></div>`}
function planView(){let b=db.buildings[0],f=db.floors.find(x=>x.buildingId===b?.id);return `<div class="notice">Éditeur schématique 2D : cliquez sur le plan pour placer le symbole choisi. Les tracés sont des repères de coordination, pas des plans d'exécution certifiés. Import DXF/PDF et cotation avancée ne sont pas inclus dans cette version.</div><div class="toolbar"><select id="planBuilding" class="field">${db.buildings.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><select id="planFloor" class="field">${db.floors.filter(x=>x.buildingId==b?.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><select id="planRoom" class="field"><option value="">Toutes les pièces / zone générale</option>${db.rooms.filter(x=>x.floorId==f?.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="plan-tools">${["select","Prise électrique","Interrupteur","Luminaire","Tableau électrique","Prise RJ45","Caméra","Détecteur","Arrivée eau","Évacuation","Conduite eau","Câble électrique","Câble réseau"].map(t=>`<button class="btn ${planTool===t?"primary":""}" data-tool="${t}">${t==="select"?"↖ Sélection":symbol(t)+" "+t}</button>`).join("")}<button class="btn danger" id="clearPlan">Effacer ce plan</button></div><div class="floorplan"><svg id="svgPlan" viewBox="0 0 1000 540" preserveAspectRatio="none"><rect x="100" y="65" width="800" height="410" fill="#fff" stroke="#34495e" stroke-width="5"/><path d="M500 65V475 M100 270H900" stroke="#7b8b9b" stroke-width="4" fill="none"/><path d="M100 270h40 M500 270h50 M900 270h-40" stroke="#fff" stroke-width="9"/><text x="500" y="35" text-anchor="middle" fill="#52667b" font-size="18">PLAN SCHÉMATIQUE — CLIQUEZ POUR PLACER</text><g id="planLines"></g><g id="planMarkers"></g></svg></div><div class="legend"><span><i class="dot" style="background:#e9a323"></i> Électricité</span><span><i class="dot" style="background:#2486d5"></i> Réseau</span><span><i class="dot" style="background:#18a77a"></i> Plomberie</span><span><i class="dot" style="background:#9b59b6"></i> Sécurité</span></div><p class="muted">Astuce : choisissez un outil puis cliquez dans le plan. Les points sont enregistrés automatiquement dans ce navigateur.</p>`}
function reportsView(){let total=db.installations.length,done=db.installations.filter(x=>x.status==="Terminé").length,cost=db.projects.reduce((a,x)=>a+(+x.budget||0),0),stock=db.equipment.reduce((a,x)=>a+x.quantity*x.unitPrice,0);return `<div class="stats">${[["Installations",total],["Terminées",done],["Avancement",total?Math.round(done/total*100)+"%":"0%"],["Budget projets",money(cost)]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong style="font-size:21px">${x[1]}</strong></div>`).join("")}</div><div class="grid2"><div class="panel"><h3>Installations par spécialité</h3>${categories.map(c=>{let n=db.installations.filter(x=>x.category===c).length;return n?`<div class="row"><b>${esc(c)}</b><span>${n}</span></div><div class="bar"><i style="width:${total?100*n/total:0}%"></i></div>`:""}).join("")}</div><div class="panel"><h3>Valorisation du stock</h3><h2>${money(stock)}</h2><p class="muted">Valeur indicative selon les prix unitaires renseignés.</p><button class="btn primary" id="printReport">Imprimer / PDF</button></div></div>`}

function renderDocuments(){$("docTable").innerHTML=table(["Type","Numéro","Client","Objet","Montant","Date","État","Actions"],db.documents.filter(x=>!$("docFilter").value||x.kind===$("docFilter").value).map(x=>`<tr><td>${esc(x.kind)}</td><td><b>${esc(x.number)}</b></td><td>${esc(x.client)}</td><td>${esc(x.object)}</td><td>${money(x.amount)}</td><td>${date(x.date)}</td><td>${badge(x.status)}</td><td>${action("document",x.id)} <button data-printdoc="${x.id}">🖨</button></td></tr>`).join(""));bindActions();document.querySelectorAll("[data-printdoc]").forEach(b=>b.onclick=()=>printDoc(+b.dataset.printdoc))}

$("save").onclick=()=>{let form=$("editForm");if(!form.reportValidity())return;let d=Object.fromEntries(new FormData(form));["buildingId","floorId","roomId","level","surface","budget","amount","quantity","min","unitPrice"].forEach(k=>{if(k in d)d[k]=d[k]===""?null:Number(d[k])});if(d.company==="—")d.company="";let k={building:"buildings",floor:"floors",room:"rooms",installation:"installations",project:"projects",technician:"team",company:"companies",equipment:"equipment",document:"documents"}[edit.type];if(edit.id){let i=db[k].findIndex(z=>z.id===edit.id);db[k][i]={...db[k][i],...d}}else db[k].push({id:id(),...d});save();closeModal();render()};

function bindPlan(){let b=$("planBuilding"),f=$("planFloor"),r=$("planRoom");function refreshFloors(){f.innerHTML=db.floors.filter(x=>x.buildingId==b.value).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");refreshRooms()}function refreshRooms(){r.innerHTML='<option value="">Toutes les pièces / zone générale</option>'+db.rooms.filter(x=>x.floorId==f.value).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");drawPlan()}b.onchange=refreshFloors;f.onchange=refreshRooms;r.onchange=drawPlan;document.querySelectorAll("[data-tool]").forEach(x=>x.onclick=()=>{planTool=x.dataset.tool;document.querySelectorAll("[data-tool]").forEach(y=>y.classList.toggle("primary",y===x))});$("clearPlan").onclick=()=>{if(confirm("Effacer les symboles et tracés de cet étage ?")){db.planItems=db.planItems.filter(x=>!(x.buildingId==b.value&&x.floorId==f.value));db.planLines=db.planLines.filter(x=>!(x.buildingId==b.value&&x.floorId==f.value));save();drawPlan()}};$("svgPlan").onclick=e=>{if(planTool==="select")return;let svg=$("svgPlan"),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let p=pt.matrixTransform(svg.getScreenCTM().inverse()),x=p.x/10,y=p.y/5.4;if(["Conduite eau","Câble électrique","Câble réseau","Évacuation"].includes(planTool)){let last=db.planLines.filter(l=>l.buildingId==b.value&&l.floorId==f.value&&l.type===planTool).slice(-1)[0];if(last){last.x2=x;last.y2=y;last.complete=true}else db.planLines.push({id:id(),buildingId:+b.value,floorId:+f.value,type:planTool,x,y,x2:x,y2:y,complete:false})}else db.planItems.push({id:id(),buildingId:+b.value,floorId:+f.value,roomId:r.value?+r.value:null,type:planTool,x,y,label:planTool.slice(0,3).toUpperCase()+"-"+String(db.planItems.length+1).padStart(2,"0")});save();drawPlan()};drawPlan()}
function drawPlan(){let b=+$("planBuilding").value,f=+$("planFloor").value;let items=db.planItems.filter(x=>x.buildingId===b&&x.floorId===f),lines=db.planLines.filter(x=>x.buildingId===b&&x.floorId===f);$("planMarkers").innerHTML=items.map(x=>`<g transform="translate(${x.x*10},${x.y*5.4})"><circle r="15" fill="${color(x.type)}" stroke="#fff" stroke-width="3"/><text text-anchor="middle" y="5" font-size="13" fill="#fff">${symbolShort(x.type)}</text><text text-anchor="middle" y="29" font-size="11" fill="#233">${esc(x.label)}</text></g>`).join("");$("planLines").innerHTML=lines.map(x=>`<line x1="${x.x*10}" y1="${x.y*5.4}" x2="${x.x2*10}" y2="${x.y2*5.4}" stroke="${color(x.type)}" stroke-width="6" stroke-linecap="round" ${x.complete?"":"stroke-dasharray='8 6'"} />`).join("")}

function exportCSV(k){k=k||({buildings:"buildings",installations:"installations",projects:"projects",team:"team",equipment:"equipment",documents:"documents"})[page]||"installations";let a=db[k]||[],cols=[...new Set(a.flatMap(x=>Object.keys(x)))],csv=[cols.join(";"),...a.map(x=>cols.map(c=>'"'+String(x[c]??"").replace(/"/g,'""')+'"').join(";"))].join("\r\n");download("batigest-"+k+".csv","\ufeff"+csv,"text/csv;charset=utf-8")}
